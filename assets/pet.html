<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>灵宠 · {{PET_NAME}}</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #ede7ff 0%, #fff5fb 55%, #e7f6ff 100%);
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    color: #2c2440;
  }
  .card {
    position: relative;
    width: 360px;
    background: rgba(255,255,255,0.82);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-radius: 28px;
    box-shadow: 0 18px 50px rgba(124,92,255,0.20), 0 2px 8px rgba(0,0,0,0.06);
    padding: 22px 22px 18px;
    overflow: hidden;
  }
  .card::before {
    content: "";
    position: absolute; inset: 0 0 auto 0; height: 96px;
    background: linear-gradient(120deg, #7C5CFF 0%, #b18bff 45%, #F5A623 100%);
    opacity: 0.92;
    border-radius: 28px 28px 40% 40%;
  }
  .topbar { position: relative; display: flex; justify-content: space-between; align-items: flex-start; }
  .daohao { color: #fff; font-size: 15px; font-weight: 700; letter-spacing: .5px; text-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .daohao small { display:block; font-weight: 500; opacity: .85; font-size: 11px; }
  .mood {
    position: relative;
    background: {{MOOD_COLOR}};
    color: #fff; font-size: 12px; font-weight: 700;
    padding: 5px 11px; border-radius: 999px;
    box-shadow: 0 4px 12px rgba(0,0,0,.18);
    animation: pop .5s ease both;
  }
  .stage {
    position: relative;
    height: 188px; margin: 8px 0 4px;
    display: flex; align-items: center; justify-content: center;
  }
  .halo {
    position: absolute; width: 168px; height: 168px; border-radius: 50%;
    background: radial-gradient(circle, rgba(181,139,255,0.28) 0%, rgba(181,139,255,0) 70%);
    animation: pulse 4s ease-in-out infinite;
  }
  .pet {
    position: relative; width: 152px; height: 152px;
    filter: drop-shadow(0 10px 16px rgba(90,60,160,0.28));
    animation: float 3.6s ease-in-out infinite, breathe 2.8s ease-in-out infinite;
  }
  .spark {
    position: absolute; width: 8px; height: 8px; border-radius: 50%;
    background: radial-gradient(circle, #fff 0%, #F5A623 60%, rgba(245,166,35,0) 100%);
    opacity: 0; animation: twinkle 2.8s ease-in-out infinite;
  }
  .spark.s1 { top: 26px; left: 56px; animation-delay: .2s; }
  .spark.s2 { top: 48px; right: 52px; animation-delay: 1.1s; width:6px;height:6px; }
  .spark.s3 { bottom: 50px; left: 70px; animation-delay: 1.7s; width:10px;height:10px; }
  .spark.s4 { bottom: 40px; right: 66px; animation-delay: .8s; }
  .ring {
    position: absolute; bottom: 14px; width: 118px; height: 20px; border-radius: 50%;
    background: radial-gradient(ellipse, rgba(124,92,255,0.20) 0%, rgba(124,92,255,0) 70%);
    animation: pulse 4s ease-in-out infinite;
  }
  .evostage { display:flex; justify-content:center; gap:6px; margin: 0 2px 10px; }
  .evostage .dot {
    font-size: 11px; padding: 3px 11px; border-radius: 999px; font-weight: 700;
    background: rgba(124,92,255,0.10); color: #a59cc4;
    transition: all .2s ease;
  }
  .evostage .dot.on {
    background: linear-gradient(120deg, #7C5CFF 0%, #F5A623 100%);
    color: #fff; box-shadow: 0 3px 10px rgba(124,92,255,0.32);
  }
  .bubble {
    position: relative;
    margin: 2px 2px 12px;
    background: #fff;
    border: 1px solid rgba(124,92,255,0.18);
    border-radius: 16px;
    padding: 11px 14px;
    font-size: 13px; line-height: 1.55; color: #3a3358;
    box-shadow: 0 6px 18px rgba(124,92,255,0.12);
    animation: rise .5s ease both;
  }
  .bubble::after {
    content: ""; position: absolute; top: -8px; left: 38px;
    border: 8px solid transparent; border-bottom-color: #fff; border-top: 0;
    filter: drop-shadow(0 -1px 0 rgba(124,92,255,0.18));
  }
  .realm { display:flex; align-items:baseline; justify-content:space-between; margin: 2px 2px 8px; }
  .realm .name { font-size: 16px; font-weight: 800; color: #4a3d7a; }
  .realm .sub  { font-size: 12px; color: #8a82a8; }
  .bar { height: 10px; border-radius: 999px; background: rgba(124,92,255,0.12); overflow: hidden; margin: 0 2px; }
  .bar > i {
    display: block; height: 100%; border-radius: 999px;
    background: linear-gradient(90deg, #7C5CFF, #F5A623);
    width: {{PROGRESS_PCT}}%;
    animation: grow 1.1s cubic-bezier(.22,1,.36,1) both;
  }
  .barinfo { display:flex; justify-content: space-between; font-size: 11px; color:#8a82a8; margin: 6px 4px 12px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .stat { background: rgba(124,92,255,0.07); border-radius: 12px; padding: 8px 4px; text-align: center; }
  .stat b { display: block; font-size: 15px; color: #5b4a9e; }
  .stat span { font-size: 10.5px; color: #97a; }
  .foot { text-align:center; font-size: 10px; color:#b3aecb; margin-top: 12px; }

  @keyframes float { 0%,100%{ transform: translateY(0);} 50%{ transform: translateY(-12px);} }
  @keyframes breathe { 0%,100%{ transform: scale(1);} 50%{ transform: scale(1.045);} }
  @keyframes pulse { 0%,100%{ transform: scale(.92); opacity:.7;} 50%{ transform: scale(1.06); opacity:1;} }
  @keyframes twinkle { 0%,100%{ opacity:0; transform: scale(.6);} 50%{ opacity:1; transform: scale(1);} }
  @keyframes pop { 0%{ transform: scale(.6); opacity:0;} 100%{ transform: scale(1); opacity:1;} }
  @keyframes rise { 0%{ transform: translateY(8px); opacity:0;} 100%{ transform: translateY(0); opacity:1;} }
  @keyframes grow { 0%{ width:0;} 100%{ width: {{PROGRESS_PCT}}%; } }
  @media (prefers-reduced-motion: reduce) {
    .pet, .halo, .ring, .spark, .mood, .bubble, .bar > i { animation: none !important; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="topbar">
      <div class="daohao">{{DAOHAO}}<small>{{PET_NAME}} · {{MATURITY}}</small></div>
      <div class="mood">{{MOOD_LABEL}}</div>
    </div>

    <div class="stage">
      <div class="halo"></div>
      <div class="ring"></div>
      <span class="spark s1"></span><span class="spark s2"></span>
      <span class="spark s3"></span><span class="spark s4"></span>
      <img class="pet" src="assets/icons/pet/{{PET_ICON_KEY}}.png" alt="{{PET_NAME}}">
    </div>

    <div class="evostage">
      <span class="dot {{STAGE_YOU}}">幼体</span>
      <span class="dot {{STAGE_CHENG}}">成体</span>
      <span class="dot {{STAGE_DIANFENG}}">巅峰</span>
    </div>

    <div class="bubble">{{BUBBLE}}</div>

    <div class="realm">
      <span class="name">{{REALM_FULL}}</span>
      <span class="sub">距{{NEXT_REALM_LABEL}} 还差 {{GAP_NEXT}} 修为</span>
    </div>
    <div class="bar"><i></i></div>
    <div class="barinfo">
      <span>修为 {{XW}} / {{XW_NEXT}}</span>
      <span>进度 {{PROGRESS_PCT}}%</span>
    </div>

    <div class="stats">
      <div class="stat"><b>{{TOTAL}}</b><span>总修仙分</span></div>
      <div class="stat"><b>{{LINGSHI}}</b><span>灵力石</span></div>
      <div class="stat"><b>{{STREAK}}</b><span>连续活跃</span></div>
      <div class="stat"><b>{{WIN}}:{{LOSE}}</b><span>论道</span></div>
    </div>

    <div class="foot">{{FOOTER_NOTE}}</div>
  </div>
</body>
</html>
